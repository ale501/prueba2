<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linux vs Windows: clasifica los comandos</title>
<style>
:root{color-scheme:light;--bg:#f3f4f6;--fg:#111827;--card:#fff;--mut:#6b7280;--lin:#0096ff;--win:#12b84a;--bd:#d1d5db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111827;--fg:#f3f4f6;--card:#1f2937;--mut:#9ca3af;--bd:#374151}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111827;--fg:#f3f4f6;--card:#1f2937;--mut:#9ca3af;--bd:#374151}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:12px}
main{max-width:900px;margin:auto;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){main{grid-template-columns:minmax(0,1fr) 220px}}
h1{font-size:18px;margin:0 0 4px}p{margin:0;color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
canvas{width:100%;max-width:600px;aspect-ratio:1;display:block;margin:auto;border-radius:8px;background:#323232}
.ctl{display:flex;gap:8px;margin-top:8px}
.ctl button{flex:1;padding:14px;font-size:16px;font-weight:700;color:#fff;border:0;border-radius:10px;cursor:pointer}
#bL{background:var(--lin)}#bW{background:var(--win)}
#nick{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font-size:14px}
ol{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
li{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 8px;border-radius:8px;background:var(--bg)}
li.me{outline:2px solid var(--lin)}
#st{font-size:12px;color:var(--mut);margin-top:6px}
#inv{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(17,24,39,.85)}
#inv .box{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:16px;padding:24px;max-width:380px;width:100%;text-align:center;display:grid;gap:12px}
#inv .emo{font-size:48px}
#inv h2{margin:0;font-size:22px}
#inv .chips{display:flex;gap:8px;justify-content:center;font-size:13px;font-weight:700}
#inv .chips span{padding:4px 10px;border-radius:999px;color:#fff}
#go{padding:14px;font-size:17px;font-weight:700;color:#fff;background:var(--win);border:0;border-radius:10px;cursor:pointer}
</style></head><body>
<div id="inv"><div class="box">
<div class="emo">🐧 ⚔️ 🪟</div>
<h2>¡Te invitaron a jugar!</h2>
<p>Clasifica cada comando que cae: ¿es de Linux o de Windows? Compite en vivo con tus compañeros.</p>
<div class="chips"><span style="background:#0096ff">← Linux</span><span style="background:#12b84a">Windows →</span></div>
<input id="nick2" maxlength="14" placeholder="Escribe tu apodo" style="padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font-size:15px;text-align:center">
<button id="go">Entrar a jugar</button>
</div></div>
<main>
<section class="card">
<h1>Linux vs Windows</h1>
<p>Flecha ← Linux · flecha → Windows. Cada acierto +10, cada error −5.</p>
<canvas id="c" width="600" height="600"></canvas>
<div class="ctl"><button id="bL">← Linux</button><button id="bW">Windows →</button></div>
</section>
<aside class="card">
<input id="nick" maxlength="14" placeholder="Tu apodo">
<div id="st">Modo solitario (sin sala)</div>
<h1 style="margin-top:12px">Ranking en vivo</h1>
<ol id="rank"></ol>
</aside>
</main>
<script>
const LIN=["ip","grep","iptables","nano","chmod","top","df","du","chown","vi","traceroute","htop","uname","tail","head","apt","systemctl","journalctl","lsblk","crontab","useradd"];
const WIN=["ipconfig","findstr","netsh","notepad","attrib","tasklist","taskmgr","chkdsk","tracert","mstsc","copy","del","cls","systeminfo","getmac","robocopy","regedit","gpupdate","winver","msinfo32","xcopy"];
const ALL=LIN.map(c=>[c,"Linux"]).concat(WIN.map(c=>[c,"Windows"]));
const cv=document.getElementById("c"),g=cv.getContext("2d"),W=600,H=600;
let score=0,cur,choice=null,last=performance.now(),started=false;
function nuevo(){const [t,s]=ALL[Math.floor(Math.random()*ALL.length)];cur={t,s,y:0};choice=null}
nuevo();
function elegir(z){choice=z}
addEventListener("keydown",e=>{if(e.key==="ArrowLeft"){elegir("Linux");e.preventDefault()}if(e.key==="ArrowRight"){elegir("Windows");e.preventDefault()}});
document.getElementById("bL").onclick=()=>elegir("Linux");
document.getElementById("bW").onclick=()=>elegir("Windows");
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(started)cur.y+=(180+Math.max(0,score)*0.6)*dt;
  g.fillStyle="#323232";g.fillRect(0,0,W,H);
  g.fillStyle="#0096ff";g.fillRect(0,H-100,W/2,100);
  g.fillStyle="#00c853";g.fillRect(W/2,H-100,W/2,100);
  g.fillStyle="#fff";g.font="36px sans-serif";g.textBaseline="top";
  g.fillText("Linux",100,H-80);g.fillText("Windows",400,H-80);
  const x=choice==="Linux"?100:choice==="Windows"?400:W/2-50;
  g.fillText(cur.t,x,cur.y);
  g.fillText("Puntaje: "+score,10,10);
  if(cur.y>=H-100){
    if(choice===cur.s)score+=10;else score-=5;
    nuevo();pub();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Sala multijugador (solo funciona si la página se abre con sesión en Claude)
let room=null,peers=[],nick=document.getElementById("nick");
try{nick.value=localStorage.getItem("nick")||""}catch(e){}
let myPeer=null,t=0;
const n2=document.getElementById("nick2");
try{n2.value=localStorage.getItem("nick")||""}catch(e){}
document.getElementById("go").onclick=()=>{
  nick.value=n2.value.trim();
  try{localStorage.setItem("nick",nick.value)}catch(e){}
  document.getElementById("inv").style.display="none";
  started=true;last=performance.now();pub();
};
n2.addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("go").click()});
function pub(){if(room){room.presence({nick:(nick.value||"Jugador").slice(0,14),score}).catch(()=>{})}}
nick.addEventListener("input",()=>{try{localStorage.setItem("nick",nick.value)}catch(e){}pub()});
function render(){
  const ol=document.getElementById("rank");ol.textContent="";
  const list=peers.filter(p=>p.presence&&typeof p.presence.score==="number")
    .sort((a,b)=>b.presence.score-a.presence.score);
  if(!room||!list.length){const li=document.createElement("li");li.textContent="Tú: "+score;ol.appendChild(li);return}
  list.forEach(p=>{
    const li=document.createElement("li");if(p.isMe&&p.sameTab)li.className="me";
    const a=document.createElement("span"),b=document.createElement("b");
    a.textContent=String(p.presence.nick||"Jugador")+(p.isMe&&p.sameTab?" (tú)":"");
    b.textContent=String(p.presence.score);li.append(a,b);ol.appendChild(li);
  });
}
(async()=>{
  try{
    const r=await claude.use("room");
    if(!r)return;
    room=r;
    document.getElementById("st").textContent="Sala en vivo conectada";
    room.onPeers(ch=>{peers=ch.peers.slice();render()});
    pub();
  }catch(e){}
})();
setInterval(()=>{pub();render()},500);
</script>
</body></html>
